# Throw-away services for tests/e2e/run.sh. Every credential here is a test placeholder.
name: arkhive-e2e

services:
  sftp:
    # stands in for the Storage Box: SFTP-only user, key authentication, non-standard port
    image: atmoz/sftp:alpine
    command: e2e::1001:1001:repo
    ports:
      - "127.0.0.1:${E2E_SFTP_PORT:-2222}:22"
    volumes:
      - ./work/ssh/id_ed25519.pub:/home/e2e/.ssh/keys/id_ed25519.pub:ro

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: e2e-root-placeholder
    ports:
      - "127.0.0.1:${E2E_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./seed/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-pg-placeholder
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${E2E_PGSQL_PORT:-15432}:5432"
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  releases:
    # fake GitHub Releases API + assets, selected only through ARKHIVE_RELEASES_API
    image: python:3-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/srv"]
    ports:
      - "127.0.0.1:${E2E_RELEASES_PORT:-18080}:8080"
    volumes:
      - ./work/releases:/srv:ro
