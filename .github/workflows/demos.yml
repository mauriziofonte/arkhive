name: Demos

# Re-records the README GIFs from docs/tapes/*.tape with vhs and commits them when they change.
# Runs on main when a tape or the console output changes, or by hand. The commit is pushed with
# GITHUB_TOKEN, which starts no other workflow.

on:
  push:
    branches: [main]
    paths:
      - 'docs/tapes/**'
      - 'app/Commands/**'
      - 'app/Application/Output/**'
      - 'app/Application/Restore/**'
      - 'app/Infrastructure/Console/**'
      - 'app/Infrastructure/Logging/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render GIFs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, mbstring, curl, zlib
          coverage: none
          ini-values: phar.readonly=0
      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Install the built PHAR and the pinned restic release
        run: |
          mkdir -p build
          tests/bin/build-phar.sh build/arkhive.phar
          sudo install -m 0755 build/arkhive.phar /usr/local/bin/arkhive
          sudo tests/bin/install-restic.sh /usr/local/bin/restic
      - name: Prepare the demo host
        # docs/tapes/setup.sh writes the site and the repository under /srv; the log lines start
        # with an emoji, which the runner's fonts lack
        run: |
          sudo chown "$(id -u):$(id -g)" /srv
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends fonts-noto-color-emoji

      - name: Render docs/tapes/demo.tape
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/tapes/demo.tape

      - name: Render docs/tapes/restore.tape
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/tapes/restore.tape

      - name: Commit changed GIFs
        run: |
          git add docs/assets/*.gif
          if git diff --cached --quiet; then
            echo "GIFs unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: re-record demo GIFs [skip ci]"
          git push
